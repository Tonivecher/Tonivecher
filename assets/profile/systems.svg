<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="330" viewBox="0 0 1200 330"
     role="img" aria-labelledby="title desc">
  <title id="title">От задачи до проверенного результата</title>
  <desc id="desc">Telegram, веб-интерфейс и документы поступают в API, проходят через ботов, агентов и автоматизацию, затем через проверку и решение владельца попадают в продакшен.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080B14"/>
      <stop offset="1" stop-color="#12172A"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".15"/>
      <stop offset=".55" stop-color="#FFFFFF" stop-opacity=".07"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".025"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset=".48" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#FDBA74"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#A78BFA"/>
    </marker>
  </defs>

  <rect width="1200" height="330" rx="34" fill="url(#background)"/>
  <ellipse cx="220" cy="340" rx="300" ry="180" fill="#67E8F9" opacity=".06"/>
  <ellipse cx="920" cy="0" rx="330" ry="190" fill="#A78BFA" opacity=".08"/>

  <g transform="translate(58 42)"
     font-family="'Avenir Next','Segoe UI Variable Display','Segoe UI',sans-serif">
    <text x="0" y="0" dominant-baseline="hanging"
          fill="#F5F7FF" font-size="38" font-weight="780" letter-spacing="-1">
      Один контур вместо разрозненных сервисов
    </text>
    <text x="1" y="56" dominant-baseline="hanging"
          fill="#8F9BB1" font-size="21" font-weight="550">
      Входы, исполнение, проверка и эксплуатация остаются частью одного продукта.
    </text>
  </g>

  <path d="M150 286H1055" fill="none" stroke="url(#flow)"
        stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)" opacity=".72"/>

  <g transform="translate(58 142)"
     font-family="'Avenir Next','Segoe UI Variable Display','Segoe UI',sans-serif">
    <g transform="translate(0)">
      <rect width="200" height="126" rx="30" fill="url(#glass)"/>
      <circle cx="34" cy="35" r="7" fill="#67E8F9"/>
      <text x="56" y="42" fill="#F5F7FF" font-size="23" font-weight="760">ВХОДЫ</text>
      <text x="26" y="82" fill="#B6C0D3" font-size="19">Telegram · Web</text>
      <text x="26" y="108" fill="#8793AA" font-size="18">файлы · формы</text>
    </g>

    <g transform="translate(220)">
      <rect width="200" height="126" rx="30" fill="url(#glass)"/>
      <circle cx="34" cy="35" r="7" fill="#79D9FF"/>
      <text x="56" y="42" fill="#F5F7FF" font-size="23" font-weight="760">ЯДРО</text>
      <text x="26" y="82" fill="#B6C0D3" font-size="19">API · состояние</text>
      <text x="26" y="108" fill="#8793AA" font-size="18">права · история</text>
    </g>

    <g transform="translate(440)">
      <rect width="200" height="126" rx="30" fill="url(#glass)"/>
      <circle cx="34" cy="35" r="7" fill="#A78BFA"/>
      <text x="56" y="42" fill="#F5F7FF" font-size="23" font-weight="760">РАБОТА</text>
      <text x="26" y="82" fill="#B6C0D3" font-size="19">боты · агенты</text>
      <text x="26" y="108" fill="#8793AA" font-size="18">n8n · документы</text>
    </g>

    <g transform="translate(660)">
      <rect width="200" height="126" rx="30" fill="url(#glass)"/>
      <circle cx="34" cy="35" r="7" fill="#C39AFB"/>
      <text x="56" y="42" fill="#F5F7FF" font-size="23" font-weight="760">КОНТРОЛЬ</text>
      <text x="26" y="82" fill="#B6C0D3" font-size="19">QA · проверки</text>
      <text x="26" y="108" fill="#8793AA" font-size="18">решение человека</text>
    </g>

    <g transform="translate(880)">
      <rect width="200" height="126" rx="30" fill="url(#glass)"/>
      <circle cx="34" cy="35" r="7" fill="#FDBA74"/>
      <text x="56" y="42" fill="#F5F7FF" font-size="23" font-weight="760">РЕЗУЛЬТАТ</text>
      <text x="26" y="82" fill="#B6C0D3" font-size="19">продакшен</text>
      <text x="26" y="108" fill="#8793AA" font-size="18">выдача · поддержка</text>
    </g>
  </g>
</svg>
