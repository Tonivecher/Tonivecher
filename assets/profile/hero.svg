            stroke-linecap="round" stroke-linejoin="round"/>
      <text x="0" y="38" text-anchor="middle" fill="#F5F8FF"
            font-size="15" font-weight="800">ПРОВЕРКА</text>
    </g>

    <g fill="#FFFFFF">
      <circle cx="-215" cy="-30" r="3" opacity=".5"/>
      <circle cx="208" cy="4" r="4" opacity=".38"/>
      <circle cx="-198" cy="150" r="2" opacity=".5"/>
      <circle cx="208" cy="-146" r="2" opacity=".55"/>
      <path d="M-210-112h18M-201-121v18" stroke="#52E6FF"
            stroke-width="2" stroke-linecap="round" opacity=".45"/>
      <path d="M190 128h16M198 120v16" stroke="#FFAD68"
            stroke-width="2" stroke-linecap="round" opacity=".45"/>
    </g>
  </g>

  <rect x="62" y="413" width="1076" height="2" rx="1"
        fill="url(#accent)" opacity=".52"/>
</svg>
