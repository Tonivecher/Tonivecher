    </g>

    <g transform="translate(-145 -84)">
      <circle r="54" fill="#FFFFFF" fill-opacity=".035"/>
      <circle r="45" fill="#6A82FF" fill-opacity=".25"/>
      <path d="M-17-15h-9v30h9M17-15h9v30h-9M-8 0h16"
            fill="none" stroke="#EEF2FF" stroke-width="3"
            stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="-5" cy="0" r="3" fill="#EEF2FF"/>
      <circle cx="5" cy="0" r="3" fill="#EEF2FF"/>
      <text x="0" y="33" text-anchor="middle" fill="#F5F8FF"
            font-size="16" font-weight="800">API</text>
    </g>

    <g transform="translate(145 -84)">
      <circle r="54" fill="#FFFFFF" fill-opacity=".035"/>
      <circle r="45" fill="#A06CF8" fill-opacity=".26"/>
      <rect x="-20" y="-16" width="40" height="30" rx="9"
            fill="none" stroke="#F5EEFF" stroke-width="3"/>
      <path d="M0-23v7M-12 22v-8M12 22v-8"
            fill="none" stroke="#F5EEFF" stroke-width="3"
            stroke-linecap="round"/>
      <circle cx="-9" cy="-1" r="3" fill="#F5EEFF"/>
      <circle cx="9" cy="-1" r="3" fill="#F5EEFF"/>
      <path d="M-8 7h16" stroke="#F5EEFF" stroke-width="3"
            stroke-linecap="round"/>
      <text x="0" y="33" text-anchor="middle" fill="#F5F8FF"
            font-size="16" font-weight="800">БОТЫ</text>
    </g>

    <g transform="translate(-145 84)">
      <circle r="54" fill="#FFFFFF" fill-opacity=".035"/>
      <circle r="45" fill="#F1A24D" fill-opacity=".24"/>
      <path d="M-16-22H9l12 12v31h-37Z"
            fill="none" stroke="#FFF2E1" stroke-width="3"
            stroke-linejoin="round"/>
      <path d="M9-22v12h12M-8-1H12M-8 8H8"
            fill="none" stroke="#FFF2E1" stroke-width="3"
            stroke-linecap="round"/>
      <text x="0" y="33" text-anchor="middle" fill="#F5F8FF"
            font-size="16" font-weight="800">ФАЙЛЫ</text>
    </g>

    <g transform="translate(145 84)">
      <circle r="54" fill="#FFFFFF" fill-opacity=".035"/>
      <circle r="45" fill="#F06C82" fill-opacity=".24"/>
      <circle cx="-11" cy="-9" r="9" fill="none"
              stroke="#FFF0F3" stroke-width="3"/>
      <circle cx="12" cy="-12" r="7" fill="none"
              stroke="#FFF0F3" stroke-width="3"/>
      <path d="M-28 19c1-18 33-18 34 0M5 17c1-13 23-13 25 0"
            fill="none" stroke="#FFF0F3" stroke-width="3"
            stroke-linecap="round"/>
      <text x="0" y="33" text-anchor="middle" fill="#F5F8FF"
            font-size="16" font-weight="800">АГЕНТЫ</text>
    </g>

    <g transform="translate(0 155)">
      <circle r="54" fill="#FFFFFF" fill-opacity=".035"/>
      <circle r="45" fill="#3DD6A0" fill-opacity=".23"/>
      <path d="M0-24c8 7 15 8 23 9v13c0 15-10 24-23 31C-13 22-23 13-23-2v-13c8-1 15-2 23-9Z"
