<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="460" viewBox="0 0 1200 460"
     role="img" aria-labelledby="title desc">
  <title id="title">AI-продукты до продакшена</title>
  <desc id="desc">Боты, агенты, интерфейсы и данные собраны в управляемую рабочую систему.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080A12"/>
      <stop offset=".5" stop-color="#0A1020"/>
      <stop offset="1" stop-color="#15122B"/>
    </linearGradient>
    <radialGradient id="cyan-glow">
      <stop offset="0" stop-color="#44D7F4" stop-opacity=".34"/>
      <stop offset="1" stop-color="#44D7F4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet-glow">
      <stop offset="0" stop-color="#9C7CFF" stop-opacity=".34"/>
      <stop offset="1" stop-color="#9C7CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orange-glow">
      <stop offset="0" stop-color="#FF9D5C" stop-opacity=".22"/>
      <stop offset="1" stop-color="#FF9D5C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".17"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity=".07"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".025"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#52E6FF"/>
      <stop offset=".52" stop-color="#A88BFF"/>
      <stop offset="1" stop-color="#FFAD68"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="460" rx="38" fill="url(#background)"/>
  <ellipse cx="1060" cy="50" rx="340" ry="260" fill="url(#violet-glow)"/>
  <ellipse cx="760" cy="470" rx="430" ry="230" fill="url(#cyan-glow)"/>
  <ellipse cx="70" cy="-20" rx="260" ry="190" fill="url(#orange-glow)"/>

  <g id="copy" transform="translate(62 48)"
     font-family="'Avenir Next','Segoe UI Variable Display','Segoe UI',sans-serif">
    <text x="0" y="20" fill="#C2CBDF" font-size="19" font-weight="750"
          letter-spacing="4">
      ПРОДУКТОВАЯ РАЗРАБОТКА · AI · АВТОМАТИЗАЦИЯ
    </text>
    <text x="0" y="102" fill="#F7F9FF" font-size="64" font-weight="850"
          letter-spacing="-2">
      AI-ПРОДУКТЫ
    </text>
    <text x="0" y="172" fill="#F7F9FF" font-size="64" font-weight="850"
          letter-spacing="-2">
      ДО ПРОДАКШЕНА
    </text>
    <text x="2" y="231" fill="#D9E1F2" font-size="29" font-weight="650">
      Боты, агенты, интерфейсы и данные.
    </text>
    <text x="2" y="270" fill="#8F9BB1" font-size="25" font-weight="520">
      Один маршрут. Проверяемый результат.
    </text>

    <g transform="translate(0 315)"
       font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
       font-size="17" font-weight="750">
      <g>
        <rect width="150" height="48" rx="24" fill="url(#glass)"/>
        <path d="M20 27a9 9 0 0 1 14 0M23 23a5 5 0 0 1 8 0M27 30h1"
              fill="none" stroke="#52E6FF" stroke-width="2.2"
              stroke-linecap="round"/>
        <text x="46" y="30" fill="#F1F5FF">УДАЛЁННО</text>
      </g>
      <g transform="translate(166)">
        <rect width="166" height="48" rx="24" fill="url(#glass)"/>
        <path d="M26 15c6 2 9 7 8 13l-6 6-8-1-3-8c2-5 4-8 9-10Z"
              fill="none" stroke="#A88BFF" stroke-width="2"/>
        <path d="M20 33l-3 4 6-2M31 31l4 4-1-6" fill="none"
              stroke="#A88BFF" stroke-width="2" stroke-linecap="round"/>
        <text x="48" y="30" fill="#F1F5FF">ПРОДАКШЕН</text>
      </g>
      <g transform="translate(348)">
        <rect width="238" height="48" rx="24" fill="url(#glass)"/>
        <circle cx="24" cy="20" r="5" fill="none" stroke="#FFAD68" stroke-width="2"/>
        <path d="M15 35c1-8 17-8 18 0M31 23l4 4 7-8" fill="none"
