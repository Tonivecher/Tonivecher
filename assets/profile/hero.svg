              fill="none" stroke="#52E6FF" stroke-width="1.8"
              stroke-linecap="round"/>
        <text x="44" y="30" fill="#F1F5FF">УДАЛЁННО</text>
      </g>
      <g transform="translate(166)">
        <rect width="166" height="48" rx="24" fill="url(#glass)"/>
        <circle cx="24" cy="24" r="10" fill="none" stroke="#A88BFF"
