<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="460" viewBox="0 0 1200 460"
     role="img" aria-labelledby="title desc">
  <title id="title">Николай — AI Product и Full-Stack инженер</title>
  <desc id="desc">Создаю Telegram-ботов, мультиагентные системы, B2B-продукты и довожу их до продакшена.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070A12"/>
      <stop offset=".52" stop-color="#0A1020"/>
      <stop offset="1" stop-color="#101326"/>
    </linearGradient>
    <radialGradient id="cyan-glow">
      <stop offset="0" stop-color="#63E6FF" stop-opacity=".42"/>
      <stop offset="1" stop-color="#63E6FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet-glow">
      <stop offset="0" stop-color="#9A7CFF" stop-opacity=".38"/>
      <stop offset="1" stop-color="#9A7CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amber-glow">
      <stop offset="0" stop-color="#FFB45E" stop-opacity=".25"/>
      <stop offset="1" stop-color="#FFB45E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".16"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity=".07"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".03"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset=".55" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#FDBA74"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="460" rx="38" fill="url(#background)"/>
  <ellipse cx="1060" cy="32" rx="330" ry="250" fill="url(#violet-glow)"/>
  <ellipse cx="780" cy="470" rx="420" ry="250" fill="url(#cyan-glow)"/>
  <ellipse cx="80" cy="0" rx="280" ry="210" fill="url(#amber-glow)"/>

  <g id="identity" transform="translate(62 44)"
     font-family="'Avenir Next','Segoe UI Variable Display','Segoe UI',sans-serif">
    <text x="0" y="20"
          fill="#BFC8DA" font-size="19" font-weight="700" letter-spacing="5">
      AI PRODUCT · FULL-STACK · AUTOMATION
    </text>
    <text x="0" y="102"
          fill="#F7F9FF" font-size="82" font-weight="800" letter-spacing="-3">
      НИКОЛАЙ
    </text>
    <text x="2" y="186"
          fill="#DCE4F5" font-size="32" font-weight="650">
      Связываю ботов, агентов и интерфейсы
    </text>
    <text x="2" y="231"
          fill="#8F9BB1" font-size="28" font-weight="500">
      в продукты, которые доходят до продакшена.
    </text>

    <g transform="translate(0 292)"
       font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
       font-size="18" font-weight="700">
      <g>
        <rect width="164" height="48" rx="24" fill="url(#glass)"/>
        <circle cx="24" cy="24" r="5" fill="#67E8F9"/>
        <text x="42" y="30" fill="#EEF3FF">УДАЛЁННО</text>
      </g>
      <g transform="translate(180)">
        <rect width="180" height="48" rx="24" fill="url(#glass)"/>
        <circle cx="24" cy="24" r="5" fill="#A78BFA"/>
        <text x="42" y="30" fill="#EEF3FF">ПРОДАКШЕН</text>
      </g>
      <g transform="translate(376)">
        <rect width="254" height="48" rx="24" fill="url(#glass)"/>
        <circle cx="24" cy="24" r="5" fill="#FDBA74"/>
        <text x="42" y="30" fill="#EEF3FF">HUMAN-IN-THE-LOOP</text>
      </g>
    </g>
  </g>

  <g id="system-orbit" transform="translate(896 230)"
     font-family="'Avenir Next','Segoe UI Variable Display','Segoe UI',sans-serif">
    <circle r="176" fill="#FFFFFF" fill-opacity=".025"/>
    <circle r="121" fill="#FFFFFF" fill-opacity=".035"/>
    <circle r="70" fill="url(#glass)"/>
    <circle r="34" fill="url(#accent)" fill-opacity=".92"/>
    <text x="0" y="-4" text-anchor="middle" fill="#08101A"
          font-size="21" font-weight="850">ПРОДУКТ</text>
    <text x="0" y="23" text-anchor="middle" fill="#152033"
          font-size="16" font-weight="700">под ключ</text>

    <g fill="none" stroke="url(#accent)" stroke-width="2" stroke-opacity=".48">
      <path d="M0-70V-138"/>
      <path d="M61-35L128-74"/>
      <path d="M61 35L128 74"/>
      <path d="M0 70V138"/>
      <path d="M-61 35L-128 74"/>
      <path d="M-61-35L-128-74"/>
    </g>

    <g font-size="18" font-weight="750" fill="#F3F6FF" text-anchor="middle">
      <g transform="translate(0 -154)">
        <circle r="42" fill="url(#glass)"/>
        <text y="6">TELEGRAM</text>
      </g>
      <g transform="translate(142 -82)">
        <circle r="42" fill="url(#glass)"/>
        <text y="6">БОТЫ</text>
      </g>
      <g transform="translate(142 82)">
        <circle r="42" fill="url(#glass)"/>
        <text y="6">АГЕНТЫ</text>
      </g>
      <g transform="translate(0 154)">
        <circle r="42" fill="url(#glass)"/>
        <text y="6">QA</text>
      </g>
      <g transform="translate(-142 82)">
        <circle r="42" fill="url(#glass)"/>
        <text y="6">ФАЙЛЫ</text>
      </g>
      <g transform="translate(-142 -82)">
        <circle r="42" fill="url(#glass)"/>
        <text y="6">API</text>
      </g>
    </g>
  </g>

  <rect x="62" y="408" width="1076" height="2" rx="1" fill="url(#accent)" opacity=".45"/>
</svg>
