    <g transform="translate(142 76)">
      <circle r="49" fill="#FFFFFF" fill-opacity=".035"/>
      <circle r="41" fill="#F06C82" fill-opacity=".24"/>
      <circle cx="-10" cy="-15" r="8" fill="none"
