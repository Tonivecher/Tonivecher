      <rect x="-18" y="-21" width="36" height="27" rx="8"
            fill="none" stroke="#F5EEFF" stroke-width="3"/>
      <path d="M0-27v6M-11 12V6M11 12V6"
            fill="none" stroke="#F5EEFF" stroke-width="3"
            stroke-linecap="round"/>
      <circle cx="-8" cy="-8" r="2.7" fill="#F5EEFF"/>
      <circle cx="8" cy="-8" r="2.7" fill="#F5EEFF"/>
      <path d="M-7-1h14" stroke="#F5EEFF" stroke-width="3"
