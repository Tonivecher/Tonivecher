      <circle cx="-5" cy="-7" r="2.5" fill="#EEF2FF"/>
      <circle cx="5" cy="-7" r="2.5" fill="#EEF2FF"/>
      <text x="0" y="31" text-anchor="middle" fill="#F5F8FF"
