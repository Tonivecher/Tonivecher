      <path d="M0-74V-111"/>
      <path d="M-64-37L-112-64"/>
      <path d="M64-37L112-64"/>
      <path d="M-64 37L-112 64"/>
      <path d="M64 37L112 64"/>
      <path d="M0 74V111"/>
    </g>

    <circle r="82" fill="#FFFFFF" fill-opacity=".035"/>
    <circle r="68" fill="url(#glass)"/>
    <path d="M0-38 25-24 0-9-25-24ZM-25-18 0-3v29l-25-15ZM25-18 0-3v29l25-15Z"
          fill="none" stroke="url(#accent)" stroke-width="3"
          stroke-linejoin="round"/>
    <text x="0" y="46" text-anchor="middle" fill="#F7F9FF"
          font-size="18" font-weight="800" letter-spacing="1">РАБОЧАЯ СИСТЕМА</text>

    <g transform="translate(0 -155)">
      <circle r="54" fill="#FFFFFF" fill-opacity=".035"/>
      <circle r="45" fill="#1EAAF1" fill-opacity=".28"/>
      <path d="M-19-7 20-22 8 21 0 7-10 15-7 3Z"
